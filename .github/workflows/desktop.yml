name: Desktop

# The Windows installer (apps/desktop). Run it by hand (Actions → Desktop → Run workflow), or push
# a tag like desktop-v0.1.0 to also attach the installer to a GitHub Release for that tag.
on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist -w @careplan/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error
      - name: Attach the installer to the release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" apps/desktop/release/*.exe
          --title "CarePlan Scheduler ${GITHUB_REF_NAME#desktop-v} for Windows"
          --notes "Windows installer. Not code-signed yet: Windows shows 'Windows protected your PC' (More info, then Run anyway)."
          --verify-tag
